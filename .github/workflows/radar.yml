name: Mushroom radar refresh
on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/mushrooms.json'
      - 'data/search_sources.json'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: mushroom-radar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run acceptance tests
        run: python -m unittest discover -s tests -v
      - name: Collect observations
        env:
          FIXED_SOURCE_URL: ${{ secrets.FIXED_SOURCE_URL }}
          MUSHROOM_SOURCE_URL: ${{ secrets.MUSHROOM_SOURCE_URL }}
          OBSERVATION_TTL_MINUTES: '90'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python radar.py
      - name: Commit updated results safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp data/mushrooms.json "${RUNNER_TEMP}/mushrooms.json"
          cp data/search_sources.json "${RUNNER_TEMP}/search_sources.json"
          # Only the generated JSON is carried forward; never force-push or
          # overwrite newer source code from another commit.
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            mkdir -p data
            cp "${RUNNER_TEMP}/mushrooms.json" data/mushrooms.json
            cp "${RUNNER_TEMP}/search_sources.json" data/search_sources.json
            git add data/mushrooms.json data/search_sources.json
            if git diff --cached --quiet; then
              echo "No JSON changes to publish."
              exit 0
            fi
            git commit -m "chore: refresh mushroom observations"
            if git push origin HEAD:main; then
              echo "Published observation data."
              exit 0
            fi
            echo "Remote main advanced during attempt ${attempt}; retrying."
            sleep 2
          done
          echo "::error::Unable to publish after 3 retries."
          exit 1

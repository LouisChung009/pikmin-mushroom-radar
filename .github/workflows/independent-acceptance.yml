name: Independent live radar acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Independent acceptance audit (must fail if data is empty or stale)
        run: python audit_acceptance.py

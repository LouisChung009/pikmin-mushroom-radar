<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pikmin Mushroom Radar</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#101827;color:#fff;font-family:system-ui}header{padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}#map{height:calc(100vh - 120px)}button,select{padding:8px;background:#23324c;color:white;border:1px solid #51617a;border-radius:6px}#status{font-size:13px;color:#ccd}a{color:#aee} #leads{padding:12px 16px;max-height:210px;overflow:auto;background:#172236}#leads a{color:#9ed5ff}#leads p{margin:6px 0;font-size:13px} </style></head><body><header><strong>🍄 Pikmin Bloom Mushroom Radar</strong><select id="filter"><option value="all">全部</option><option value="giant">巨大蘑菇（近期觀測）</option><option value="live">近期觀測</option><option value="fixed">固定菇點</option><option value="upstream">上游公開即時資料</option></select><button id="reload">重新載入</button><span id="status">載入中</span></header><div id="map"></div><section id="leads" aria-live="polite">Gemini 搜尋線索載入中（不等於即時菇點）</section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([23.7,121],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);let layer=L.layerGroup().addTo(map),upstreamLayer=L.layerGroup().addTo(map),data,upstreamRows=[],upstreamState='尚未載入',upstreamTotalCount=0,upstreamReturned=0;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){layer.clearLayers();upstreamLayer.clearLayers();if(!data)return;let f=document.getElementById('filter').value,rows=[...(data.fixed||[]),...(data.live||[])].filter(x=>f==='all'||(f==='giant'&&x.kind==='live'&&x.giant)||(f==='live'&&x.kind==='live')||(f==='fixed'&&x.kind==='fixed'));const ext=(f==='all'||f==='upstream')?upstreamRows:[];for(const x of rows){if(!Number.isFinite(+x.lat)||!Number.isFinite(+x.lon))continue;let m=L.circleMarker([+x.lat,+x.lon],{radius:x.giant?11:7,color:x.giant?'#efb539':x.kind==='live'?'#6adbaa':'#74aaff',weight:2,fillOpacity:.8});m.bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.kind==='live'?'近期觀測':'固定位置')+'<br>'+esc(x.size)+'<br>'+esc(x.observed_at||'無觀測時間'));m.addTo(layer)}for(const x of ext){const m=L.circleMarker([x.lat,x.lon],{radius:x.giant?11:8,color:x.giant?'#efb539':'#c58cff',weight:2,fillOpacity:.85});m.bindPopup('<b>'+esc(x.name)+'</b><br>上游公開 API 資料<br>'+esc(x.size||'')+'<br>'+esc(x.observed_at||'上游未提供觀測時間'));m.addTo(upstreamLayer)}document.getElementById('status').textContent='固定菇點 '+data.fixed_count+'｜近期觀測 '+data.live_count+'｜巨大 '+data.live_giant_count+'｜上游 API 總筆數 '+upstreamTotalCount+'、本次 '+upstreamReturned+' 筆、可定位 '+upstreamRows.length+'（'+upstreamState+'）｜目前顯示 '+(rows.length+ext.length)+'｜更新：'+(data.updated_at?new Date(data.updated_at).toLocaleString('zh-TW'):'未知')+(data.status==='no_observations'?'｜本地來源尚無資料':'')}
async function load(){try{let r=await fetch('./data/mushrooms.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();draw()}catch(e){document.getElementById('status').textContent='資料讀取失敗：'+e.message}}async function loadUpstream(){const endpoint='https://mush.odyliao.cc/api/mushrooms';try{const url=new URL(endpoint);url.searchParams.set('limit','1000');const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const payload=await response.json();const records=Array.isArray(payload)?payload:(payload.mushrooms||payload.data||payload.items||[]);if(!Array.isArray(records))throw Error('API 格式未識別');upstreamTotalCount=Number(payload.count)||records.length;upstreamReturned=Number(payload.returned)||records.length;const now=Date.now()/1000;upstreamRows=records.map(x=>{const lat=Number(x.lat),lon=Number(x.lng??x.lon),seen=Number(x.last_observed_at??x.last_seen??x.discovered_at);const observedAt=Number.isFinite(seen)?new Date(seen*1000).toISOString():null;const place=[x.location_country,x.location_city].filter(Boolean).join(' · ');return{name:place||String(x.name||x.id||'未命名菇點'),lat,lon,size:'等級 '+String(x.level??'未知')+' · 類型 '+String(x.type??'未知'),giant:false,observed_at:observedAt,_seen:seen};}).filter(x=>Number.isFinite(x.lat)&&Number.isFinite(x.lon)&&x.lat>=-90&&x.lat<=90&&x.lon>=-180&&x.lon<=180&&Number.isFinite(x._seen)&&now-x._seen>=0&&now-x._seen<=90*60).map(({_seen,...x})=>x);upstreamState='讀取成功；只顯示 90 分鐘內且有座標的觀測';}catch(e){upstreamRows=[];upstreamTotalCount=0;upstreamReturned=0;upstreamState='讀取失敗：'+e.message;}draw()}

async function loadSearchLeads(){const el=document.getElementById('leads');try{const response=await fetch('./data/search_sources.json?t='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const payload=await response.json();el.textContent='';const title=document.createElement('strong');title.textContent='Gemini 網路搜尋線索（未經遊戲即時驗證）｜'+(payload.count||0)+' 筆';el.append(title);if(payload.mode==='not_configured'){el.append(document.createTextNode(' — 尚未設定 GEMINI_API_KEY'));return;}const date=document.createElement('p');date.textContent='搜尋時間：'+(payload.searched_at?new Date(payload.searched_at).toLocaleString('zh-TW'):'未知');el.append(date);for(const item of (payload.results||[]).slice(0,40)){if(!/^https?:\/\//i.test(item.url||''))continue;const p=document.createElement('p'),a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title||item.url;p.append(a);el.append(p)}}catch(e){el.textContent='Gemini 搜尋資料尚未發布：'+e.message;}} 
document.getElementById('filter').onchange=draw;document.getElementById('reload').onclick=()=>{load();loadSearchLeads();loadUpstream()};load();loadSearchLeads();loadUpstream();setInterval(loadUpstream,60000);
</script></body></html>

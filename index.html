<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pikmin Mushroom Radar</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>body{margin:0;background:#101827;color:#fff;font-family:system-ui}header{padding:14px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}#map{height:calc(100vh - 120px)}button,select{padding:8px;background:#23324c;color:white;border:1px solid #51617a;border-radius:6px}#status{font-size:13px;color:#ccd}a{color:#aee} #leads{padding:12px 16px;max-height:210px;overflow:auto;background:#172236}#leads a{color:#9ed5ff}#leads p{margin:6px 0;font-size:13px} </style></head><body><header><strong>🍄 Pikmin Bloom Mushroom Radar</strong><select id="filter" aria-label="蘑菇篩選"><option value="all">全部</option><option value="giant">巨大蘑菇（近期觀測）</option><option value="live">近期觀測</option><option value="fixed">固定菇點</option></select><button id="reload">重新載入</button><span id="status">載入中</span></header><div id="map"></div><section id="leads" aria-live="polite">Gemini 搜尋線索載入中（不等於即時菇點）</section><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const map=L.map('map').setView([23.7,121],7);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map);let data;
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function draw(){layer.clearLayers();if(!data)return;const f=document.getElementById('filter').value;const ttl=Math.min(Number(data.ttl_minutes)||90,90)*60000;const live=(data.live||[]).filter(x=>{const age=Date.now()-Date.parse(x.observed_at);return age>=0&&age<=ttl});const rows=[...(data.fixed||[]),...live].filter(x=>f==='all'||(f==='giant'&&x.kind==='live'&&x.giant)||(f==='live'&&x.kind==='live')||(f==='fixed'&&x.kind==='fixed'));for(const x of rows){if(!Number.isFinite(+x.lat)||!Number.isFinite(+x.lon))continue;const m=L.circleMarker([+x.lat,+x.lon],{radius:x.giant?11:7,color:x.giant?'#efb539':x.kind==='live'?'#6adbaa':'#74aaff',weight:2,fillOpacity:.8});m.bindPopup('<b>'+esc(x.name)+'</b><br>'+esc(x.kind==='fixed'?'固定菇點（不代表目前有巨大菇）':x.verification==='maintainer_approved_report'?'社群審核回報':'近期觀測')+'<br>種類：'+esc(x.mushroom_type||'未提供')+'<br>大小：'+esc(x.size)+'<br>'+esc(x.observed_at||'無觀測時間'));m.addTo(layer)}document.getElementById('status').textContent='固定菇點 '+(data.fixed||[]).length+'｜近期觀測 '+live.length+'｜巨大 '+live.filter(x=>x.giant===true).length+'｜目前顯示 '+rows.length+'｜資料內容變更：'+(data.updated_at?new Date(data.updated_at).toLocaleString('zh-TW'):'未知')+(!live.length?'｜FAIL：尚無有效近期觀測，雷達未通過驗收':'｜資料仍須通過獨立驗收')}
async function load(){try{const r=await fetch('./data/mushrooms.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();draw()}catch(e){document.getElementById('status').textContent='資料讀取失敗：'+e.message}}
async function loadSearchLeads(){const el=document.getElementById('leads');try{const r=await fetch('./data/search_sources.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const p=await r.json();el.textContent='';const title=document.createElement('strong');title.textContent='Gemini 網路搜尋線索（未經遊戲即時驗證）｜'+(p.count||0)+' 筆';el.append(title);if(p.mode==='not_configured'){el.append(document.createTextNode(' — 尚未設定 GEMINI_API_KEY'));return}const date=document.createElement('p');date.textContent='搜尋時間：'+(p.searched_at?new Date(p.searched_at).toLocaleString('zh-TW'):'未知');el.append(date);for(const item of (p.results||[]).slice(0,40)){if(!/^https?:\/\//i.test(item.url||''))continue;const pEl=document.createElement('p'),a=document.createElement('a');a.href=item.url;a.target='_blank';a.rel='noopener noreferrer';a.textContent=item.title||item.url;pEl.append(a);el.append(pEl)}}catch(e){el.textContent='Gemini 搜尋線索尚未發布：'+e.message}}
document.getElementById('filter').onchange=draw;document.getElementById('reload').onclick=()=>{load();loadSearchLeads()};load();loadSearchLeads();setInterval(draw,30000);setInterval(()=>{load();loadSearchLeads()},60000);
</script></body></html>
